name: Build Windows App and Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller psutil

      - name: Build standalone executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name voltinfer-windows-x64
          --add-data "dashboard;dashboard"
          --hidden-import voltinfer_gui
          voltinfer_launcher.py

      - name: Smoke test executable
        run: .\dist\voltinfer-windows-x64.exe --help

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltinfer-windows-installer
          path: |
            dist/voltinfer-windows-x64.exe
            dist/VoltInfer-Setup.exe
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VoltInfer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/voltinfer-windows-x64.exe
            dist/VoltInfer-Setup.exe
          fail_on_unmatched_files: true
